services:
  - type: web
    name: gongora-transport
    runtime: node
    plan: free
    buildCommand: npm install
    startCommand: npm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: gongora-transport-db
          property: connectionString
      - key: APP_PASSWORD
        sync: false

databases:
  - name: gongora-transport-db
    plan: free
